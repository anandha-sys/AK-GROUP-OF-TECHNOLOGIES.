<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AK Group of Technologies | Coming Soon</title>
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Animated Gradient Background */
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0b0c10, #1f2833, #0a192f, #020c1b);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main Container */
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 800px;
            width: 90%;
            animation: fadeIn 2s ease-in-out;
        }

        /* Brand Name */
        .brand {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 4px;
            color: #66fcf1;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        /* Coming Soon Text */
        .title {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ffffff, #c5c6c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite alternate;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #c5c6c7;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        /* Animated Loading Dots */
        .loader {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .loader span {
            width: 15px;
            height: 15px;
            background-color: #45a29e;
            border-radius: 50%;
            animation: bounce 0.5s alternate infinite;
        }

        .loader span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .loader span:nth-child(3) {
            animation-delay: 0.3s;
        }

        /* Keyframes for animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            from { text-shadow: 0 0 10px rgba(102, 252, 241, 0.2); }
            to { text-shadow: 0 0 20px rgba(102, 252, 241, 0.6); }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); background-color: #66fcf1; box-shadow: 0 0 10px #66fcf1; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .title { font-size: 2.5rem; }
            .brand { font-size: 1.2rem; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">AK Group of Technologies</div>
        <h1 class="title">COMING SOON</h1>
        <p class="subtitle">We are building something extraordinary. Our new website is under construction.</p>
        
        <div class="loader">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</body>
</html>
