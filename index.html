<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AK Group of Technologies</title>
  
  <!-- Importing a futuristic terminal font and a clean sans-serif -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;800&display=swap" rel="stylesheet">
  
  <style>
    /* Reset and Base Styles */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #050505; /* Deep OS dark mode */
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow: hidden; /* Prevents scrollbars from the canvas */
    }

    /* Hero Container */
    #hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* WebGL/Canvas Background */
    #network-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Foreground Content */
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      pointer-events: none; /* Lets mouse interact with canvas behind the text */
    }

    h1 {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 30px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .accent {
      color: #00ffcc; /* Cyberpunk/Tech Cyan */
      text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
    }

    /* Terminal Prompt Box */
    .terminal-box {
      background: rgba(10, 10, 10, 0.8);
      border: 1px solid #333;
      padding: 15px 30px;
      border-radius: 6px;
      font-family: 'Fira Code', monospace;
      font-size: 1.2rem;
      display: inline-block;
      backdrop-filter: blur(10px);
      pointer-events: auto; /* Re-enable clicks for the terminal */
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .prompt {
      color: #00ffcc;
      margin-right: 10px;
    }

    /* Initialize Button */
    .init-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'Fira Code', monospace;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0;
      transition: color 0.3s ease;
    }

    /* Blinking Underscore Animation */
    .init-btn::after {
      content: '_';
      animation: blink 1s step-end infinite;
    }

    .init-btn:hover {
      color: #00ffcc;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <section id="hero">
    <!-- The Neural Network Canvas -->
    <canvas id="network-canvas"></canvas>
    
    <!-- The Text and Terminal Prompt -->
    <div class="hero-content">
      <h1>Engineering the <span class="accent">Future</span></h1>
      
      <div class="terminal-box">
        <span class="prompt">ak-group@system:~$</span>
        <button class="init-btn" onclick="runDiagnostics()">Initialize</button>
      </div>
    </div>
  </section>

  <script>
    // --- Canvas Particle Network Logic ---
    const canvas = document.getElementById('network-canvas');
    const ctx = canvas.getContext('2d');
    
    let particlesArray;
    
    // Set canvas to full screen
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Track mouse position
    let mouse = {
      x: null,
      y: null,
      radius: 150 // Distance mouse attracts particles
    }
    
    window.addEventListener('mousemove', function(event) {
      mouse.x = event.x;
      mouse.y = event.y;
    });
    
    window.addEventListener('mouseout', function() {
      mouse.x = undefined;
      mouse.y = undefined;
    });

    // Create Particle Object
    class Particle {
      constructor(x, y, directionX, directionY, size, color) {
        this.x = x;
        this.y = y;
        this.directionX = directionX;
        this.directionY = directionY;
        this.size = size;
        this.color = color;
      }
      
      // Draw individual particle
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
        ctx.fillStyle = '#00ffcc';
        ctx.fill();
      }
      
      // Move particle and check bounds
      update() {
        if (this.x > canvas.width || this.x < 0) {
          this.directionX = -this.directionX;
        }
        if (this.y > canvas.height || this.y < 0) {
          this.directionY = -this.directionY;
        }
        
        this.x += this.directionX;
        this.y += this.directionY;
        this.draw();
      }
    }
    
    // Initialize particle array
    function init() {
      particlesArray = [];
      let numberOfParticles = (canvas.height * canvas.width) / 9000;
      
      for (let i = 0; i < numberOfParticles; i++) {
        let size = (Math.random() * 2) + 1;
        let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
        let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
        let directionX = (Math.random() * 2) - 1.5;
        let directionY = (Math.random() * 2) - 1.5;
        let color = '#00ffcc';
        
        particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
      }
    }
    
    // Connect points with lines based on distance
    function connect() {
      let opacityValue = 1;
      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a; b < particlesArray.length; b++) {
          let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
          + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
          
          if (distance < (canvas.width / 7) * (canvas.height / 7)) {
            opacityValue = 1 - (distance / 20000);
            ctx.strokeStyle = 'rgba(0, 255, 204,' + opacityValue + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
        
        // Connect to mouse cursor
        if (mouse.x && mouse.y) {
          let mouseDistance = ((particlesArray[a].x - mouse.x) * (particlesArray[a].x - mouse.x))
          + ((particlesArray[a].y - mouse.y) * (particlesArray[a].y - mouse.y));
          
          if (mouseDistance < 20000) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }
      }
    }
    
    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
      }
      connect();
    }
    
    // Handle Window Resize
    window.addEventListener('resize', function() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
      init();
    });
    
    // Button Action
    function runDiagnostics() {
      const btn = document.querySelector('.init-btn');
      btn.innerText = 'Initializing Systems...';
      btn.style.color = '#fff';
      
      // Simulate loading state before smoothly scrolling to next section
      setTimeout(() => {
        alert("System initialized! Ready to transition to the Mobile & Cloud division.");
        btn.innerText = 'Initialize';
        btn.style.color = '';
      }, 1500);
    }

    init();
    animate();
  </script>
</body>
</html>
